<!DOCTYPE html>
<html lang="zh-Hant" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<!--[if mso]>
<noscript>
<xml>
<o:OfficeDocumentSettings>
<o:PixelsPerInch>96</o:PixelsPerInch>
</o:OfficeDocumentSettings>
</xml>
</noscript>
<![endif]-->
<title></title>
<style>
  body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
  body { margin: 0; padding: 0; width: 100% !important; background: #f7f9f8; }

  /*
    Heading levels double as Friday's separate "eyebrow" + "title" blocks, using
    the same H1/H2/H3 choices already in Kit's own formatting dropdown:
      H3 = small kicker/eyebrow label (e.g. "產業觀察" above the title)
      H1 = the email's main title
      H2 = optional secondary section heading inside a longer email
  */
  .content-body h3 {
    color: #16a34a; font-weight: 800; font-size: 11px; line-height: 1.4;
    letter-spacing: .1em; margin: 0 0 10px;
  }
  .content-body h1, .content-body h2 { color: #0b1f17; font-weight: 700; line-height: 1.35; margin: 0 0 16px; }
  .content-body h1 { font-size: 26px; }
  .content-body h2 { font-size: 19px; margin-top: 32px; }
  .content-body p { color: #33443b; font-size: 15px; line-height: 1.8; margin: 0 0 16px; }
  .content-body a { color: #0d7134; font-weight: 700; text-decoration: underline; }
  .content-body ul, .content-body ol { margin: 0 0 16px; padding-left: 22px; color: #33443b; font-size: 15px; line-height: 1.8; }
  .content-body li { margin-bottom: 6px; }
  .content-body blockquote { margin: 20px 0; padding: 4px 0 4px 16px; border-left: 3px solid #16a34a; color: #607068; font-size: 14px; }
  .content-body img { max-width: 100%; height: auto; border-radius: 12px; margin: 8px 0 20px; }
  .content-body hr { border: none; border-top: 1px solid #dce6e0; margin: 28px 0; }
  /*
    Kit's plain-text editor has no way to attach a custom class to a link, so
    this pill-button style only applies if you paste raw HTML for that one
    line (if Kit's editor exposes an HTML/source view). Otherwise, just make
    the CTA a normal bold link -- .content-body a below already renders links
    in the brand green.
  */
  .content-body .btn,
  .content-body a.btn {
    display: inline-block;
    background: #0d7134;
    color: #ffffff !important;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 999px;
    margin: 8px 0 20px;
  }

  @media only screen and (max-width: 600px) {
    .email-container { width: 100% !important; }
    .email-padding { padding-left: 20px !important; padding-right: 20px !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; background:#f7f9f8;">
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f7f9f8;">
    <tr>
      <td align="center" style="padding: 32px 16px;">

        <!--[if mso]>
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td>
        <![endif]-->
        <table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background:#ffffff; border:1px solid #dce6e0; border-radius:18px; overflow:hidden;">

          <!-- Header -->
          <tr>
            <td class="email-padding" style="padding: 28px 40px; border-bottom: 1px solid #dce6e0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td width="40" valign="middle">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td width="38" height="38" align="center" valign="middle" bgcolor="#16a34a" style="background:#16a34a; border-radius:11px; font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei','Segoe UI',Helvetica,Arial,sans-serif; font-size:17px; font-weight:700; color:#ffffff;">
                          D
                        </td>
                      </tr>
                    </table>
                  </td>
                  <td valign="middle" style="padding-left: 12px; font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei','Segoe UI',Helvetica,Arial,sans-serif;">
                    <div style="font-size:19px; font-weight:700; color:#0b1f17; line-height:1;">Data Machi</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Content (populated per broadcast/sequence by Kit) -->
          <tr>
            <td class="email-padding content-body" style="padding: 36px 40px 12px; font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei','Segoe UI',Helvetica,Arial,sans-serif;">
              {{ message_content }}
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td class="email-padding" style="padding: 4px 40px 0;">
              <div style="border-top:1px solid #dce6e0;"></div>
            </td>
          </tr>

          <!-- Footer (fixed chrome text -- edit here, not per-campaign, to change it for every future send) -->
          <tr>
            <td class="email-padding" align="center" style="padding: 24px 40px 32px; font-family:-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei','Segoe UI',Helvetica,Arial,sans-serif;">
              <p style="margin:0 0 16px; font-size:13px; line-height:1.7; color:#607068;">
                喜歡這篇內容嗎？歡迎轉發給對企業 AI 工作流有興趣的朋友。
              </p>
              <p style="margin:0 0 8px; font-size:12px; line-height:1.7; color:#95a29b;">
                {{ address }}
              </p>
              <p style="margin:0; font-size:12px; line-height:1.7; color:#95a29b;">
                <a href="{{ subscriber_preferences_link }}" style="color:#607068; text-decoration:underline;">更新訂閱偏好</a>
                &nbsp;·&nbsp;
                <a href="{{ unsubscribe_link }}" style="color:#607068; text-decoration:underline;">取消訂閱</a>
              </p>
            </td>
          </tr>

        </table>
        <!--[if mso]>
        </td></tr></table>
        <![endif]-->

      </td>
    </tr>
  </table>
</body>
</html>
